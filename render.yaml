databases:
  - name: moneyflow-db
    databaseName: moneyflow
    user: moneyflow
    plan: free

services:
  - type: web
    name: moneyflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moneyflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: COOKIE_SECURE
        value: true
      - key: FRONTEND_URL
        value: https://moneyflow-frontend.onrender.com

  - type: web
    name: moneyflow-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://moneyflow-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
